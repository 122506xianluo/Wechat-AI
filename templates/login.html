<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>WeChat-AI 本机登录</title><link rel="stylesheet" href="/static/manage.css"><body><main style="max-width:540px;padding-top:70px"><section><h1>{{ '登录管理后台' if initialized else '初始化 owner 账户' }}</h1><p>仅本机访问。密码至少12位；恢复码仅展示一次，请妥善保存。</p><form id="form"><label>账户<input id="username" required maxlength="80" autocomplete="username"></label><label>密码<input id="password" type="password" required minlength="12" autocomplete="current-password"></label><label>恢复码（仅找回密码时填写）<input id="code" autocomplete="off"></label><button type="submit">{{ '登录' if initialized else '创建 owner' }}</button>{% if initialized %}<button type="button" id="recover">恢复并设置新密码</button>{% endif %}</form><pre id="result" role="status"></pre></section></main><script>
const result=document.querySelector('#result');async function submit(action){const data={username:document.querySelector('#username').value,password:document.querySelector('#password').value,code:document.querySelector('#code').value};try{const r=await fetch('/api/v1/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error);if(x.recovery_code&&action==='init'){result.textContent='Owner 创建成功，请立即保存恢复码（仅本次显示）：\n'+x.recovery_code;document.querySelector('#form').hidden=true;const enter=document.createElement('button');enter.type='button';enter.textContent='我已保存恢复码，进入控制台';enter.onclick=()=>{location.href='/'};document.querySelector('section').appendChild(enter);}else if(x.recovery_code&&action==='recover'){result.textContent='密码恢复成功，请保存新的恢复码（仅本次显示）：\n'+x.recovery_code+'\n保存后刷新页面，使用新密码登录。';document.querySelector('#form').hidden=true;}else{location.href='/'}}catch(e){result.textContent=e.message}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();submit({{ ("login" if initialized else "init") | tojson }})};document.querySelector('#recover')?.addEventListener('click',()=>submit('recover'));
</script></body></html>
