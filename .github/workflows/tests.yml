name: Windows offline tests
on:
  push:
    branches: [main, test, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Compile project (exclude runtime and virtualenv)
        run: python -m compileall -q -x '[\\/](?:\.venv|\.git|data|\.cache)[\\/]' .
      - name: Offline unit, migration and fake UI tests (business coverage >=80%)
        run: python -m pytest -m "not live" --cov --cov-report=term-missing --cov-report=xml
      - name: Whitespace and tracked-runtime checks
        run: |
          git diff --check
          python tools/check_tracked_files.py
